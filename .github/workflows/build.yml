name: Build Unsigned IPA

on:
  push:
    branches: [ main, master, 'preview-*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Check calendar dates and holidays
        run: |
          swiftc Shared/EthiopianDate.swift Shared/EthiopianHoliday.swift Tests/main.swift -o /tmp/ethiopian-calendar-checks
          /tmp/ethiopian-calendar-checks

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project EthiopianCalendar.xcodeproj \
            -scheme EthiopianCalendar \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/EthiopianCalendar.app Payload/
          find Payload -name "*.dSYM" -exec rm -rf {} +
          zip -r -y EthiopianCalendar.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EthiopianCalendar-ipa
          path: EthiopianCalendar.ipa
