<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ethiopian Calendar — local preview</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1c1c1e; background: #e9e9ed; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; }
    .layout { display: flex; align-items: flex-start; gap: 34px; }
    .phone { width: 393px; height: 852px; background: #f2f2f7; border: 8px solid #222326; border-radius: 54px; box-shadow: 0 24px 70px #0003; overflow: hidden; position: relative; }
    .phone::before { content: ""; position: absolute; z-index: 3; top: 9px; left: 50%; transform: translateX(-50%); width: 112px; height: 28px; background: #222326; border-radius: 20px; }
    .screen { height: 100%; overflow-y: auto; scrollbar-width: none; padding: 59px 16px 30px; }
    .screen::-webkit-scrollbar { display: none; }
    h1 { font-size: 34px; line-height: 1.12; letter-spacing: -.8px; margin: 0 0 24px; font-weight: 700; }
    .card { border-radius: 20px; margin-bottom: 20px; }
    .today { padding: 22px; background: linear-gradient(135deg,#14733d,#0d4d2e); color: white; text-align: center; box-shadow: 0 4px 10px #0002; }
    .weekday { font-size: 15px; font-weight: 600; opacity: .9; }
    .day-large { font-size: 64px; line-height: 1.08; font-weight: 700; letter-spacing: -2px; margin: 8px 0; }
    .ethiopic-date { font-size: 22px; font-weight: 700; }
    .english-date { font-size: 15px; opacity: .85; margin-top: 8px; }
    .rule { height: 1px; background: #ffffff50; margin: 18px 0 12px; }
    .gregorian { font-size: 12px; font-weight: 500; opacity: .85; }
    .calendar, .tip { background: white; padding: 16px; }
    .month-head { display: flex; align-items: center; justify-content: space-between; text-align: center; gap: 8px; margin-bottom: 14px; }
    .month-head strong { display: block; font-size: 17px; }
    .month-head small { display: block; color: #777780; font-size: 12px; margin-top: 2px; }
    .nav { border: 0; background: transparent; color: #24a243; font-size: 30px; line-height: 1; cursor: pointer; width: 44px; height: 44px; border-radius: 50%; }
    .nav:hover { background: #edf8ee; }
    .nav:focus-visible, .back:focus-visible { outline: 3px solid #116b35; outline-offset: 2px; }
    .grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 8px 6px; text-align: center; }
    .grid .wd { font-size: 11px; color: #777780; font-weight: 600; height: 25px; display: grid; place-items: center; }
    .grid .cell { height: 36px; display: grid; place-items: center; font-size: 15px; }
    .grid .cell.today-cell { color: white; background: #24a243; border-radius: 50%; font-weight: 700; }
    .back { display: block; margin: 14px auto 0; border: 0; background: transparent; color: #168435; font-size: 12px; font-weight: 600; cursor: pointer; padding: 10px; }
    .back[hidden] { display: none; }
    .tip { display: flex; gap: 12px; align-items: flex-start; border-radius: 16px; }
    .tip-icon { color: #24a243; font-size: 24px; }
    .tip strong { font-size: 15px; }
    .tip p { font-size: 12px; line-height: 1.4; color: #777780; margin: 3px 0 0; }
    .aside { max-width: 255px; padding-top: 18px; color: #38383b; }
    .aside h2 { font-size: 18px; margin: 0 0 8px; }
    .aside p { font-size: 14px; line-height: 1.5; margin: 0; }
    @media(max-width:730px) { body { padding: 0; display: block; background: #f2f2f7; } .layout { display: block; } .phone { width: 100%; height: 100dvh; border: 0; border-radius: 0; box-shadow: none; } .phone::before { display:none; } .screen { padding-top: 54px; } .aside { display: none; } }
  </style>
</head>
<body>
  <div class="layout">
    <main class="phone" aria-label="Ethiopian Calendar app preview">
      <div class="screen">
        <h1>Ethiopian Calendar</h1>
        <section class="card today" aria-label="Today"><div class="weekday" id="weekday"></div><div class="day-large" id="day"></div><div class="ethiopic-date" id="ethiopic-date"></div><div class="english-date" id="english-date"></div><div class="rule"></div><div class="gregorian" id="gregorian"></div></section>
        <section class="card calendar" aria-label="Month calendar"><div class="month-head"><button class="nav" id="prev" aria-label="Previous month">‹</button><div><strong id="month-title"></strong><small id="month-subtitle"></small></div><button class="nav" id="next" aria-label="Next month">›</button></div><div class="grid" id="grid"></div><button class="back" id="back" hidden>Back to Today</button></section>
        <section class="card tip"><div class="tip-icon" aria-hidden="true">▦</div><div><strong>Add Home Screen Widget</strong><p>Long-press your Home Screen, tap + (Edit &gt; Add Widget), and search for Ethiopian Calendar.</p></div></section>
      </div>
    </main>
    <aside class="aside"><h2>Local preview</h2><p>This mirrors the current SwiftUI screen for layout and month navigation. Changes here can be reviewed on this PC before rebuilding the native app.</p></aside>
  </div>
  <script>
    const amMonths = ['መስከረም','ጥቅምት','ኅዳር','ታኅሣሥ','ጥር','የካቲት','መጋቢት','ሚያዝያ','ግንቦት','ሰኔ','ሐምሌ','ነሐሴ','ጳጉሜ'];
    const enMonths = ['Meskerem','Tikimt','Hidar','Tahsas','Tir','Yekatit','Megabit','Miyazya','Ginbot','Sene','Hamle','Nehase','Pagume'];
    const amWeekdays = ['እሑድ','ሰኞ','ማክሰኞ','ረቡዕ','ሐሙስ','ዓርብ','ቅዳሜ'];
    const enWeekdays = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const shortWeekdays = ['እሑ','ሰኞ','ማክ','ረቡ','ሐሙ','ዓር','ቅዳ'];
    const ethiopic = new Intl.DateTimeFormat('en-u-ca-ethiopic', {year:'numeric',month:'numeric',day:'numeric'});
    function parts(date) { const p = Object.fromEntries(ethiopic.formatToParts(date).map(x => [x.type,x.value])); return {day:+p.day,month:+p.month,year:+p.year}; }
    function epochDay(date) { return Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())/86400000; }
    function newYear(year) { for(let day=9;day<=14;day++) { const date=new Date(year+7,8,day,12); const p=parts(date); if(p.year===year&&p.month===1&&p.day===1) return epochDay(date); } throw Error('Could not resolve Ethiopian new year'); }
    function startOfMonth(month,year) { return newYear(year)+(month-1)*30; }
    const now=new Date(), today=parts(now), todayWeekday=now.getDay();
    let displayMonth=today.month, displayYear=today.year;
    document.querySelector('#weekday').textContent=`${amWeekdays[todayWeekday]} • ${enWeekdays[todayWeekday]}`;
    document.querySelector('#day').textContent=today.day;
    document.querySelector('#ethiopic-date').textContent=`${amMonths[today.month-1]} ${today.year} ዓ.ም.`;
    document.querySelector('#english-date').textContent=`${enMonths[today.month-1]} ${today.day}, ${today.year} E.C.`;
    document.querySelector('#gregorian').textContent=`Gregorian: ${new Intl.DateTimeFormat(undefined,{dateStyle:'medium'}).format(now)}`;
    function render() {
      document.querySelector('#month-title').textContent=`${amMonths[displayMonth-1]} ${displayYear}`;
      document.querySelector('#month-subtitle').textContent=enMonths[displayMonth-1];
      const grid=document.querySelector('#grid'); grid.replaceChildren();
      for(const name of shortWeekdays) { const el=document.createElement('div');el.className='wd';el.textContent=name;grid.append(el); }
      const start=startOfMonth(displayMonth,displayYear), count=displayMonth===13?newYear(displayYear+1)-start:30;
      const firstDay=new Date(start*86400000).getUTCDay();
      for(let i=0;i<firstDay;i++) { const el=document.createElement('div');el.className='cell';grid.append(el); }
      for(let i=1;i<=count;i++) { const el=document.createElement('div');el.className='cell'+(i===today.day&&displayMonth===today.month&&displayYear===today.year?' today-cell':'');el.textContent=i;grid.append(el); }
      document.querySelector('#back').hidden=displayMonth===today.month&&displayYear===today.year;
    }
    document.querySelector('#prev').onclick=()=>{ if(displayMonth===1){displayMonth=13;displayYear--;}else displayMonth--;render(); };
    document.querySelector('#next').onclick=()=>{ if(displayMonth===13){displayMonth=1;displayYear++;}else displayMonth++;render(); };
    document.querySelector('#back').onclick=()=>{displayMonth=today.month;displayYear=today.year;render();};
    render();
  </script>
</body>
</html>
