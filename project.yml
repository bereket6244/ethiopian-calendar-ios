name: EthiopianCalendar
options:
  bundleIdPrefix: com.ethiopiancalendar
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEBUG_INFORMATION_FORMAT: dwarf
targets:
  EthiopianCalendar:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethiopiancalendar.app
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: EthiopianCalendarWidget
        embed: true

  EthiopianCalendarWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethiopiancalendar.app.widget
        INFOPLIST_FILE: Widget/Info.plist
        SKIP_INSTALL: YES
schemes:
  EthiopianCalendar:
    build:
      targets:
        EthiopianCalendar: all
        EthiopianCalendarWidget: all
